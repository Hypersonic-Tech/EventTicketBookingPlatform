<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your Ticket | EVENTX</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/ticket.css"
    >

</head>


<body class="ticket-page">


<header class="navbar">

    <div class="container navbar-inner">

        <a
            href="../index.html"
            class="brand"
        >

            <span class="brand-mark">
                E
            </span>

            <span class="brand-name">
                EVENT<span>X</span>
            </span>

        </a>


        <div class="nav-actions">

            <a
                href="attendee/dashboard.html"
                class="login-link"
            >
                Dashboard
            </a>

            <a
                href="attendee/tickets.html"
                class="btn btn-secondary"
            >
                My Tickets
            </a>

        </div>

    </div>

</header>


<main class="ticket-main">

    <div class="container">


        <div class="ticket-heading">

            <span class="eyebrow">
                BOOKING CONFIRMED
            </span>

            <h1>
                You're
                <span>going.</span>
            </h1>

            <p>
                Your ticket is ready. Keep this QR code
                available when you arrive at the event.
            </p>

        </div>


        <section
            id="ticketContainer"
            class="ticket-container"
        >

            Loading ticket...

        </section>

    </div>

</main>


<script src="../js/core/api.js"></script>
<script src="../js/core/auth.js"></script>
<script src="../js/core/router.js"></script>

<script src="../js/services/ticketService.js"></script>

<script src="../js/pages/ticket.js"></script>

</body>

</html>
